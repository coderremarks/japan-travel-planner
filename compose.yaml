# Production-like local stack: PostgreSQL, the API, the web app and an edge proxy.
#
#   cp .env.example .env          # set POSTGRES_PASSWORD (and optionally TABIJI_DEMO_PASSWORD)
#   docker compose up --build --wait
#   open http://localhost:3000
#
# Only the edge proxy publishes a port, and only on 127.0.0.1. The database sits on an internal
# network without internet access. The stack speaks plain HTTP because it runs on localhost; a real
# deployment terminates TLS in front of the edge and keeps the API's secure cookie defaults
# (docs/deployment.md).
name: tabiji

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  db:
    <<: *hardening
    image: postgres:18.7-alpine3.24@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    environment:
      POSTGRES_DB: tabiji
      POSTGRES_USER: tabiji
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      # PostgreSQL 18 images keep their data below /var/lib/postgresql/18/.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabiji -d tabiji"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [data]

  api:
    <<: *hardening
    build: ./backend
    image: tabiji-api:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/tabiji
      DATABASE_USERNAME: tabiji
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      # Plain HTTP on localhost only: browsers accept __Host-/Secure cookies over HTTPS (some also on
      # localhost), so this stack uses the relaxed cookie of the local profile. Production keeps the
      # defaults from application.yml.
      SERVER_SERVLET_SESSION_COOKIE_NAME: TABIJI_SESSION
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
      # The demo account is created only when TABIJI_DEMO_PASSWORD is set.
      APP_DEMO_ENABLED: "true"
      TABIJI_DEMO_PASSWORD: ${TABIJI_DEMO_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [data, app]

  web:
    <<: *hardening
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://api:8080
    image: tabiji-web:local
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    networks: [app]

  edge:
    <<: *hardening
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TABIJI_PORT:-3000}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop: [ALL]
    # The image grants this file capability to the caddy binary; it must stay in the bounding set
    # or the binary cannot start. Caddy itself listens on the unprivileged port 8080.
    cap_add: [NET_BIND_SERVICE]
    networks: [app]

networks:
  data:
    internal: true
  app: {}

volumes:
  db-data: {}
