# Weekly dependency updates, grouped to keep the pull-request count low. A 7-day cooldown means a new
# release is only proposed once it has been public for a week, which filters out most compromised or
# hastily withdrawn versions (security updates are not delayed).
version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
        update-types: ["minor", "patch"]
      maven-plugins:
        patterns: ["*maven-plugin*", "com.diffplug.spotless*", "com.github.spotbugs*", "org.jacoco*"]
        update-types: ["minor", "patch"]
      test:
        patterns: ["org.junit*", "org.assertj*", "org.mockito*", "org.testcontainers*", "io.zonky*", "com.tngtech.archunit*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Groups carry only minor and patch updates; a major version arrives as its own pull request, so a
    # breaking change can no longer hold back safe updates grouped with it.
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript stays on 5.x while openapi-typescript (contract -> client types) requires it (ADR-0009).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node.js type definitions follow the Node.js 24 LTS runtime (ADR-0008).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    ignore:
      # Java 21 and Node.js 24 are the LTS lines chosen in ADR-0008. Changing line is a deliberate
      # decision, not a routine update (the first run proposed Java 24, already end-of-life, and Node 26).
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # The maven build image's tag encodes the Maven *and* the JDK version, and Dependabot proposes JDK
      # changes as Maven updates. Update it by hand, together with the Maven wrapper.
      - dependency-name: "maven"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    ignore:
      # A PostgreSQL major version changes the on-disk format: the existing volume needs pg_upgrade or a
      # dump and restore, so it is a planned migration, never a routine bump.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
