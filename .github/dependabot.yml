# Weekly dependency updates, grouped to keep the pull-request count low. A 7-day cooldown means a new
# release is only proposed once it has been public for a week, which filters out most compromised or
# hastily withdrawn versions (security updates are not delayed).
version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
      maven-plugins:
        patterns: ["*maven-plugin*", "com.diffplug.spotless*", "com.github.spotbugs*", "org.jacoco*"]
      test:
        patterns: ["org.junit*", "org.assertj*", "org.mockito*", "org.testcontainers*", "io.zonky*", "com.tngtech.archunit*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
