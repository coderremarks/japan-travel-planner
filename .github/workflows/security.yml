# Supply-chain and secret hygiene.
#   secrets       - gitleaks over the full git history (fails the run on a finding)
#   dependencies  - OSV-Scanner over the Maven and npm dependency trees. On pull requests it fails only
#                   on vulnerabilities the change introduces; on main and on the weekly schedule it
#                   reports every known one under Security > Code scanning without failing the run.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 21 * * 0" # Mondays 06:41 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (full history)
        # Reviewed false positives are listed in .gitleaksignore at the repository root.
        run: >-
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo
          --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1

  dependencies-pr:
    name: New vulnerable dependencies (OSV-Scanner)
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      runs-on: ubuntu-24.04

  dependencies:
    name: Known vulnerable dependencies (OSV-Scanner)
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      runs-on: ubuntu-24.04
      fail-on-vuln: false
